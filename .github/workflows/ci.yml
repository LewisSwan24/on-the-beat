# ON THE BEAT — every push to main and every pull request:
#
#   test      npm test: the Vite build, then every test. The runner has a C++
#             compiler, so the firmware's logic is built and held against the
#             real relay here rather than skipped.
#   firmware  the wristband's firmware, built by PlatformIO exactly as
#             `pio run` builds it on a laptop, and kept as a download: the
#             app on its own, and one image with the bootloader and partition
#             table that flashes whole at 0x0.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firmware/platformio.ini
      - name: Keep PlatformIO's toolchain and libraries between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build
        run: pio run -d firmware
      - name: One image to flash whole
        run: |
          build=firmware/.pio/build/m5stickc
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            -o "$build/otb-wristband-full.bin" --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$build/firmware.bin"
          ls -l "$build"/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: otb-wristband-${{ github.sha }}
          path: |
            firmware/.pio/build/m5stickc/otb-wristband-full.bin
            firmware/.pio/build/m5stickc/firmware.bin
          if-no-files-found: error
