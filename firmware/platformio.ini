; ON THE BEAT — the wristband's firmware.
;
; One build for the M5StickC Plus and the Plus2 (and the first M5StickC, drawn
; smaller): M5Unified works out which one it is running on. The StickS3 is an
; ESP32-S3, which no ESP32 image will boot on, so it has an env of its own.
;
;   cd firmware
;   pio run -t upload        build it and flash it over USB
;   pio device monitor       its serial console: ssid, pass, relay, show
;
;   pio run -e m5sticks3 -t upload      the same, for a StickS3
;   pio device monitor -e m5sticks3
;
; The logic in src/band_logic.h is also built on a laptop, by npm test.

[platformio]
default_envs = m5stickc

[env:m5stickc]
platform = espressif32@^6.9.0
board = m5stick-c
framework = arduino
; TLS, Wi-Fi and the screen fonts do not fit the default 1.25 MB app partition.
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
; M5Unified from 0.2.22 for the speaker's buffer release callback, which the
; sounds wait on before writing a buffer again (main.cpp playSounds()).
lib_deps =
  m5stack/M5Unified@^0.2.22
  links2004/WebSockets@^2.6.1

; The M5StickS3: ESP32-S3-PICO-1-N8R8 (8 MB flash, 8 MB octal PSRAM), set up
; as M5Stack's StickS3 page sets it up. There is no USB-serial chip: the
; console is the S3's own USB, hence USB_CDC_ON_BOOT. M5Unified knows the
; StickS3 from 0.2.14; the sounds need 0.2.22, as above.
[env:m5sticks3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified@^0.2.22
  links2004/WebSockets@^2.6.1
