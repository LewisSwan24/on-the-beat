# ON THE BEAT — the relay on Fly.io: one machine, always on, in Sydney.
#
# Exactly one machine: every room lives in its memory, so a second machine
# would split the phones from their wristbands. Deploy with --ha=false. The
# night is also written to the machine's one volume, so a deploy or a restart
# carries it on (docs/superpowers/specs/2026-09-29-restart-persistence-design.md),
# and a machine with a volume is never given a second.

app = "on-the-beat"
primary_region = "syd"

[env]
  PORT = "8080"
  # The night turns over at 06:00 where the venue is, not where the machine is.
  NIGHT_TZ = "Australia/Brisbane"
  # Fly's proxy is the only way in, and it names each client here.
  CLIENT_IP_HEADER = "fly-client-ip"
  # The night, written within a second of a change and read back at start.
  NIGHT_FILE = "/data/night.json"
  # The keys staff devices' notifications are signed with, made at the first start and kept on the same volume.
  PUSH_KEYS_FILE = "/data/push-keys.json"
  # Tonight's shows, when the venue team has put a file there: edit it, restart the machine, done (docs/show-night.md).
  # No file there is the ordinary case, and the list that ships with the relay stands.
  SHOWS = "/data/shows.json"
  # The phone app's Content-Security-Policy is written and proven in headless Chrome and WebKit, but no iPhone has read its
  # connect-src yet. Until one has, the app keeps the framing rule it has always had, so a deploy can go out without it:
  # to turn the policy on, delete this line (or write "full") and change tests/deploy.test.js with it.
  APP_CSP = "framing-only"

# One 1 GB volume, made once: flyctl volumes create night -r syd -s 1 --scheduled-snapshots=false
# No snapshots: nothing of a night is kept past it, and last night's file is no use tonight.
[mounts]
  source = "night"
  destination = "/data"
  scheduled_snapshots = false

[http_service]
  internal_port = 8080
  force_https = true
  # Never asleep: a wristband should never find its relay stopped.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every phone and wristband holds a socket open all night.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
